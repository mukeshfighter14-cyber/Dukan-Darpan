                      "🏪 2. दुकान का नाम, WhatsApp नंबर और UPI ID सेट करें",
                      "🚚 3. ग्राहकों के ऑर्डर का लाइव स्टेटस बदलें (Update Order Status)",
                      "🗑️ 4. कोई पुराना सामान लिस्ट से हटाएं (Delete Item)",
                      "🔄 5. डिफ़ॉल्ट 10 सामान वापस रीसेट करें (Reset Catalog)"
                  )

                  AlertDialog.Builder(this)
                      .setTitle("👑 मालिक कंट्रोल सेंटर (Owner Panel)")
