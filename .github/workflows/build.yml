                  layout.addView(pinInput)

                  AlertDialog.Builder(this)
                      .setTitle("🏪 दुकान और पेमेंट सेटिंग्स")
                      .setView(scroll)
                      .setPositiveButton("💾 सेव करें") { _, _ ->
                          prefs.edit()
                              .putString("shop_name", shopInput.text.toString().trim().ifEmpty { "अपना सुपर बाज़ार" })
                              .putString("owner_whatsapp", waInput.text.toString().trim())
                              .putString("owner_upi", upiInput.text.toString().trim())
                              .putInt("free_delivery_limit", freeLimitInput.text.toString().toIntOrNull() ?: 299)
                              .putString("admin_pin", pinInput.text.toString().trim().ifEmpty { "1234" })
                              .apply()
                          refreshProductList()
                          Toast.makeText(this, "✅ आपकी दुकान की सेटिंग्स सेव हो गईं!", Toast.LENGTH_SHORT).show()
                      }
                      .setNegativeButton("रद्द करें", null)
                      .show()
              }

              private fun showAddProductDialog() {
                  val scroll = ScrollView(this)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(18), dp(12), dp(18), dp(12))
                  }
                  scroll.addView(layout)

                  val nameInput = EditText(this).apply {
                      hint = "सामान या डिश का नाम (जैसे: समोसा कचौरी या चीनी 1 Kg)"
                  }

                  val catSpinner = Spinner(this).apply {
                      val prodCats = arrayOf("🍔 फूड (Food)", "🥦 किराना (Grocery)", "🛍️ शॉपिंग (Store)")
                      adapter = ArrayAdapter(this@MainActivity, android.R.layout.simple_spinner_dropdown_item, prodCats)
                  }

                  val priceInput = EditText(this).apply {
                      hint = "बिक्री कीमत (Selling Price ₹, जैसे 120)"
                      inputType = InputType.TYPE_CLASS_NUMBER
                  }

                  val mrpInput = EditText(this).apply {
                      hint = "MRP कीमत (छूट दिखाने के लिए, जैसे 150)"
                      inputType = InputType.TYPE_CLASS_NUMBER
                  }

                  val timeInput = EditText(this).apply {
                      hint = "डिलीवरी समय (जैसे: 20 mins या Same Day)"
                      setText("25 mins")
                  }

                  val emojiInput = EditText(this).apply {
                      hint = "आइकन इमोजी (जैसे 🍕, 🥛, 📱, 🛍️)"
                      setText("🍲")
                  }

                  val descInput = EditText(this).apply {
                      hint = "सामान का विवरण (जैसे: ताज़ा और शुद्ध)"
                  }

                  layout.addView(nameInput)
                  layout.addView(catSpinner)
                  layout.addView(priceInput)
                  layout.addView(mrpInput)
                  layout.addView(timeInput)
                  layout.addView(emojiInput)
                  layout.addView(descInput)

                  AlertDialog.Builder(this)
                      .setTitle("➕ नया खाना या सामान जोड़ें")
                      .setView(scroll)
                      .setPositiveButton("ऐप में जोड़ें") { _, _ ->
                          val name = nameInput.text.toString().trim()
                          val price = priceInput.text.toString().toIntOrNull() ?: 0
                          val mrp = mrpInput.text.toString().toIntOrNull() ?: price
                          if (name.isEmpty() || price <= 0) {
                              Toast.makeText(this, "कृपया नाम और सही कीमत डालें!", Toast.LENGTH_SHORT).show()
                              return@setPositiveButton
                          }

                          val newProd = Product(
                              id = "p_" + System.currentTimeMillis(),
                              name = name,
                              category = catSpinner.selectedItem.toString(),
                              price = price,
                              mrp = maxOf(price, mrp),
                              time = timeInput.text.toString().trim().ifEmpty { "25 mins" },
                              rating = "4.8",
                              desc = descInput.text.toString().trim().ifEmpty { "बेस्ट क्वालिटी और ताज़ा होम डिलीवरी" },
                              emoji = emojiInput.text.toString().trim().ifEmpty { "🛍️" }
                          )

                          products.add(0, newProd)
                          saveProductsToPrefs()
                          refreshProductList()
                          Toast.makeText(this, "✅ '$name' आपकी दुकान में जुड़ गया!", Toast.LENGTH_SHORT).show()
                      }
                      .setNegativeButton("रद्द करें", null)
                      .show()
              }

              private fun showDeleteProductDialog() {
                  if (products.isEmpty()) return
                  val names = products.map { "${it.emoji} ${it.name} (₹${it.price})" }.toTypedArray()

                  AlertDialog.Builder(this)
                      .setTitle("🗑️ हटाने के लिए सामान चुनें")
                      .setItems(names) { _, which ->
                          val removed = products.removeAt(which)
                          cart.remove(removed.id)
                          saveProductsToPrefs()
                          refreshProductList()
                          updateCartBar()
                          Toast.makeText(this, "🗑️ '${removed.name}' हटा दिया गया", Toast.LENGTH_SHORT).show()
                      }
                      .setNegativeButton("रद्द करें", null)
                      .show()
              }

              private fun showAdminOrderStatusDialog() {
                  if (orders.isEmpty()) {
                      Toast.makeText(this, "अभी कोई ऑर्डर नहीं है!", Toast.LENGTH_SHORT).show()
                      return
                  }

                  val listLabels = orders.map { "${it.orderId} - ${it.customerName} (₹${it.totalAmount})" }.toTypedArray()
                  AlertDialog.Builder(this)
                      .setTitle("🚚 किस ऑर्डर का स्टेटस बदलना है?")
                      .setItems(listLabels) { _, idx ->
                          val ord = orders[idx]
                          val stages = arrayOf(
                              "1️⃣ ऑर्डर कन्फर्म (Order Placed)",
                              "2️⃣ पैकिंग चल रही है (Packing)",
                              "3️⃣ डिलीवरी के लिए निकला (Out for Delivery)",
                              "4️⃣ डिलीवर हो गया (Delivered ✅)"
                          )
                          AlertDialog.Builder(this)
                              .setTitle("${ord.orderId} का नया स्टेटस चुनें")
                              .setItems(stages) { _, stageIdx ->
                                  ord.statusIndex = stageIdx
                                  saveOrdersToPrefs()
                                  Toast.makeText(this, "✅ ऑर्डर स्टेटस अपडेट हो गया!", Toast.LENGTH_SHORT).show()
                              }
                              .show()
                      }
                      .show()
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SuperBazaar-Shopping-APK
          path: app/build/outputs/apk/debug/app-debug.apk
